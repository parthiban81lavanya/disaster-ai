services:
  app:   # the whole application (API + Control Room + mobile app)
    build: .
    ports: ["8000:8080"]
    environment:
      AUTH_MODE: ${AUTH_MODE:-off}          # "on" = require sign-in for Control Room / Rescue Officer
      SHIELD_SECRET: ${SHIELD_SECRET:-}      # >= 16 random chars, needed when AUTH_MODE=on
      SHIELD_USERS: ${SHIELD_USERS:-}        # contents of backend/users.json
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}     # optional: persist data in Upstash Redis
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
  db:
    image: postgis/postgis:16-3.4
    environment: { POSTGRES_PASSWORD: shield, POSTGRES_DB: disastershield }
    ports: ["5432:5432"]
    volumes: ["./backend/db/migrations:/docker-entrypoint-initdb.d:ro"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
